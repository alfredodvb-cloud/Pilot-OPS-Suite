<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── URLs ──────────────────────────────────────────────────────────────────────
const APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz_7AGB7wGYnTx41RtG08KxrjXub75iqiuSPMUq-7FoKM-NeM8uF4iNgmtC7zBg_ykR6g/exec";
const RUTAS_URL   = "https://script.google.com/macros/s/AKfycbz_7AGB7wGYnTx41RtG08KxrjXub75iqiuSPMUq-7FoKM-NeM8uF4iNgmtC7zBg_ykR6g/exec?action=rutas";
const APRS_URL    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbqz7iBnZmsOoigGJLziFBEext2KnjxJxu_xMQ39YPGurOHF6helKQKkZ8dgg-fNHr3Jz_9V1ReE5F/pub?gid=1758815938&single=true&output=csv";
const STORAGE_RUTAS = "altroute-rutas-v1";
const STORAGE_APRS  = "altroute-aprs-v1";

// ─── Storage (localStorage) ────────────────────────────────────────────────────
function storageGet(key) {
  try { return Promise.resolve(localStorage.getItem(key)); } catch { return Promise.resolve(null); }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, val); } catch {} return Promise.resolve();
}
function storageDel(key) {
  try { localStorage.removeItem(key); } catch {} return Promise.resolve();
}

// ─── CSV Parsers ───────────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const cells = [];
  let cur = "", inQ = false;
  for (const ch of line) {
    if (ch === '"') inQ = !inQ;
    else if (ch === ',' && !inQ) { cells.push(cur.trim()); cur = ""; }
    else cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function parseRutas(text) {
  return text.trim().split("\n").filter(l=>l.trim()).slice(1).map(line => {
    const c = parseCSVLine(line);
    return { origen:c[0]||"", pistaSalida:c[1]||"", sid:c[2]||"", ruta:c[3]||"", alterno:c[4]||"", puntoEnlace:c[5]||"" };
  }).filter(r => r.origen && r.alterno);
}

function parseAprs(text) {
  return text.trim().split("\n").filter(l=>l.trim()).slice(1).map(line => {
    const c = parseCSVLine(line);
    return { alterno:c[0]||"", puntoEnlace:c[1]||"", pistaLleg:c[2]||"", star:c[3]||"", app:c[4]||"", appVia:c[5]||"" };
  }).filter(r => r.alterno);
}

// ─── Fetch via JSONP (Apps Script) ────────────────────────────────────────────
function fetchViaProxy(url) {
  return new Promise((resolve, reject) => {
    const cb = "gsCb_" + Date.now();
    const script = document.createElement("script");
    script.src = url + "&callback=" + cb;
    const timer = setTimeout(() => {
      if (document.body.contains(script)) document.body.removeChild(script);
      delete window[cb];
      reject(new Error("Timeout"));
    }, 12000);
    window[cb] = (data) => {
      clearTimeout(timer);
      if (document.body.contains(script)) document.body.removeChild(script);
      delete window[cb];
      resolve(data.csv || "");
    };
    document.body.appendChild(script);
  });
}

// ─── Direct fetch (GitHub Pages can do this!) ─────────────────────────────────
async function fetchSheet(action) {
  // Try direct fetch first (works from GitHub Pages)
  try {
    const url = action === "rutas"
      ? RUTAS_URL
      : APRS_URL;
    const res = await fetch(url, { redirect:"follow" });
    if (res.ok) {
      const text = await res.text();
      if (text && !text.includes("<!DOCTYPE")) return text;
    }
  } catch {}
  // Fallback: JSONP via Apps Script
  const proxyUrl = APPS_SCRIPT + "?action=" + action;
  return fetchViaProxy(proxyUrl);
}

// ─── JSONP via Apps Script ────────────────────────────────────────────────────
function fetchViaAppsScript(action, ids) {
  return new Promise((resolve, reject) => {
    const cb = "gasp_cb_" + action + "_" + Date.now();
    // Register callback FIRST before anything else
    window[cb] = (data) => {
      if (document.getElementById(cb)) document.getElementById(cb).remove();
      delete window[cb];
      if (data && data.ok) resolve(data.data);
      else reject(new Error(data ? data.error : "Sin respuesta"));
    };
    const timer = setTimeout(() => {
      if (document.getElementById(cb)) document.getElementById(cb).remove();
      delete window[cb];
      reject(new Error("Timeout"));
    }, 15000);
    const script = document.createElement("script");
    script.id = cb;
    script.src = APPS_SCRIPT + "?action=" + action + "&ids=" + encodeURIComponent(ids) + "&callback=" + cb;
    script.onerror = () => {
      clearTimeout(timer);
      delete window[cb];
      reject(new Error("Script load error"));
    };
    document.head.appendChild(script);
  });
}

// ─── Wind helpers ─────────────────────────────────────────────────────────────
function rwyHdg(rwyId) {
  const n = parseInt(String(rwyId).replace(/[LRC]/g, ""));
  return isNaN(n) ? null : n * 10;
}

function WindIndicator({ metar, rwyId }) {
  if (!metar || !rwyId) return null;
  const wm = metar.match(/\b(\d{3}|VRB)(\d{2,3})KT/);
  if (!wm || wm[1] === "VRB") return <span style={{fontSize:10,color:"#2a4a6b",fontFamily:"monospace"}}>VRB</span>;
  const dir = parseInt(wm[1]);
  const spd = parseInt(wm[2]);
  const hdg = rwyHdg(rwyId);
  if (hdg === null) return null;
  const diff = ((dir - hdg + 180) % 360) - 180;
  const rad  = diff * Math.PI / 180;
  const hw   = Math.round(spd * Math.cos(rad));
  const xw   = Math.round(Math.abs(spd * Math.sin(rad)));
  const isHead = hw >= 0;
  return (
    <div style={{display:"flex",alignItems:"center",gap:5,fontFamily:"monospace",fontSize:11}}>
      <span style={{fontSize:15,color:isHead?"#2ecc71":"#e74c3c",lineHeight:1}}>{isHead?"↓":"↑"}</span>
      <span style={{color:isHead?"#2ecc71":"#e74c3c",fontWeight:"bold"}}>{Math.abs(hw)}kt {isHead?"HW":"TW"}</span>
      {xw > 0 && <span style={{color:"#f5c518"}}>| {xw}kt XW</span>}
    </div>
  );
}

// ─── Styles ────────────────────────────────────────────────────────────────────
const S = {
  inp:  { background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, color:"#e0eaf6", padding:"8px 12px", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box", width:"100%" },
  lbl:  { color:"#4a90d9", fontSize:10, fontFamily:"monospace", marginBottom:4, display:"block", letterSpacing:"0.08em" },
  card: (b) => ({ background:"#0d1b2a", border:"1px solid "+(b||"#1e3a5f"), borderRadius:10, padding:20, marginBottom:16 }),
  tag:  (c) => ({ background:c==="blue"?"#1a2d42":"#0d2a1e", border:"1px solid "+(c==="blue"?"#2a7fd4":"#00d4aa"), borderRadius:4, padding:"2px 10px", fontSize:11, color:c==="blue"?"#4a90d9":"#00d4aa", fontFamily:"monospace", whiteSpace:"nowrap" }),
  pill: (c) => ({ background:"#0d1b2a", border:"1px solid "+(c||"#1e3a5f"), borderRadius:4, padding:"1px 8px", fontSize:10, color:c||"#6a8aac", fontFamily:"monospace", whiteSpace:"nowrap" }),
};

// ─── RouteCard ─────────────────────────────────────────────────────────────────
function RouteCard({ r, aprs, wx }) {
  const [open, setOpen] = useState(false);
  const matchAprs = aprs.filter(a =>
    a.alterno === r.alterno &&
    (!r.puntoEnlace || !a.puntoEnlace || a.puntoEnlace === r.puntoEnlace)
  );
  return (
    <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:8, overflow:"hidden", marginBottom:8 }}>
      <div onClick={() => setOpen(o => !o)} style={{ padding:"11px 16px", cursor:"pointer", display:"flex", alignItems:"center", gap:10, justifyContent:"space-between" }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, flex:1, minWidth:0, flexWrap:"wrap" }}>
          <span style={S.tag("blue")}>{r.origen} / {r.pistaSalida}</span>
          <span style={{ color:"#2a4a6b", fontSize:11 }}>→</span>
          {r.sid  && <span style={S.pill("#4a90d9")}>{r.sid}</span>}
          {r.ruta && <span style={{ fontSize:11, color:"#6a8aac", fontFamily:"monospace", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:200 }}>{r.ruta}</span>}
          {r.puntoEnlace && <span style={S.pill("#f5c518")}>{r.puntoEnlace}</span>}
          <span style={{ color:"#2a4a6b", fontSize:11 }}>→</span>
          <span style={S.tag("green")}>{r.alterno}</span>
          <span style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>({matchAprs.length} APR)</span>
        </div>
        <span style={{ color:"#2a4a6b", fontSize:12, flexShrink:0, marginLeft:8 }}>{open ? "▲" : "▼"}</span>
      </div>
      {open && (
        <div style={{ borderTop:"1px solid #1e3a5f", background:"#07111d" }}>
          <div style={{ padding:"12px 16px", borderBottom:"1px solid #0f2030" }}>
            <div style={{ fontSize:9, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:6 }}>RUTA COMPLETA</div>
            <div style={{ fontSize:13, color:"#f5c518", fontFamily:"monospace", lineHeight:1.9, letterSpacing:"0.07em", wordBreak:"break-all" }}>
              {[r.sid, r.ruta].filter(Boolean).join(" ")}
            </div>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", borderBottom:"1px solid #0f2030" }}>
            {[
              { label:"DESDE",        val:r.origen+" / RWY "+r.pistaSalida, c:"#4a90d9" },
              { label:"SID",          val:r.sid         || "—",             c:"#4a90d9" },
              { label:"RUTA",         val:r.ruta        || "—",             c:"#8aabcc" },
              { label:"PUNTO ENLACE", val:r.puntoEnlace || "—",             c:"#f5c518" },
            ].map((f, i) => (
              <div key={i} style={{ padding:"10px 14px", borderRight:i<3?"1px solid #0f2030":"none" }}>
                <div style={{ fontSize:9, color:"#2a4a6b", letterSpacing:"0.06em", marginBottom:3 }}>{f.label}</div>
                <div style={{ fontSize:12, color:f.c, fontFamily:"monospace", wordBreak:"break-all" }}>{f.val}</div>
              </div>
            ))}
          </div>
          <div style={{ padding:"12px 16px" }}>
            <div style={{ fontSize:9, color:"#00d4aa", letterSpacing:"0.08em", marginBottom:10 }}>
              APROXIMACIONES {r.alterno} — {matchAprs.length} disponibles
            </div>
            {matchAprs.length === 0 ? (
              <div style={{ fontSize:11, color:"#2a4a6b", fontFamily:"monospace" }}>Sin aproximaciones cargadas para {r.alterno}</div>
            ) : (
              <div style={{display:"grid",gridTemplateColumns:"70px 1fr 1fr 1fr 140px"}}>
                {["RWY","STAR","APP","APP VIA","VIENTO"].map((h,i) => (
                  <div key={i} style={{fontSize:9,color:"#2a4a6b",padding:"4px 10px",borderBottom:"1px solid #0f2030"}}>{h}</div>
                ))}
                {matchAprs.map((a, i) => {
                  const altMetar = wx && wx[r.alterno]?.metar;
                  return (
                    <React.Fragment key={i}>
                      <div style={{padding:"8px 10px",borderBottom:i<matchAprs.length-1?"1px solid #0a1825":"none",fontSize:12,color:"#00d4aa",fontFamily:"monospace",fontWeight:"bold"}}>{a.pistaLleg}</div>
                      <div style={{padding:"8px 10px",borderBottom:i<matchAprs.length-1?"1px solid #0a1825":"none",fontSize:11,color:"#8aabcc",fontFamily:"monospace"}}>{a.star||"—"}</div>
                      <div style={{padding:"8px 10px",borderBottom:i<matchAprs.length-1?"1px solid #0a1825":"none",fontSize:11,color:"#f5c518",fontFamily:"monospace"}}>{a.app||"—"}</div>
                      <div style={{padding:"8px 10px",borderBottom:i<matchAprs.length-1?"1px solid #0a1825":"none",fontSize:11,color:"#8aabcc",fontFamily:"monospace"}}>{a.appVia||"—"}</div>
                      <div style={{padding:"8px 10px",borderBottom:i<matchAprs.length-1?"1px solid #0a1825":"none"}}>
                        <WindIndicator metar={altMetar} rwyId={a.pistaLleg} />
                      </div>
                    </React.Fragment>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Import Modal ──────────────────────────────────────────────────────────────
function ImportModal({ title, url, onImport, onClose }) {
  const [csv, setCsv] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const textareaRef = useRef(null);

  async function tryAutoLoad() {
    setLoading(true); setErr("");
    try {
      const action = title.includes("RUTAS") ? "rutas" : "aproximaciones";
      const text = await fetchSheet(action);
      if (text && text.trim()) { onImport(text); return; }
      throw new Error("Sin datos");
    } catch(e) {
      setErr("Auto-carga falló: " + e.message + " — pega el CSV manualmente");
    }
    setLoading(false);
  }

  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, padding:16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background:"#0d1b2a", border:"1px solid #00d4aa", borderRadius:12, padding:24, maxWidth:620, width:"100%" }}>
        <div style={{ fontSize:10, color:"#00d4aa", letterSpacing:"0.12em", marginBottom:16 }}>↑ IMPORTAR — {title}</div>

        <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:8, padding:"12px 14px", marginBottom:12 }}>
          <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:8 }}>OPCIÓN 1 — Carga automática</div>
          <button onClick={tryAutoLoad} disabled={loading}
            style={{ background:"linear-gradient(135deg,#1a6fb5,#0d4a8a)", border:"1px solid #2a7fd4", color:"#e0eaf6", borderRadius:6, padding:"7px 16px", cursor:"pointer", fontFamily:"monospace", fontSize:11, fontWeight:"bold" }}>
            {loading ? "⏳ Cargando..." : "⚡ Cargar desde Sheet"}
          </button>
          {err && <div style={{ fontSize:10, color:"#e74c3c", marginTop:8, fontFamily:"monospace" }}>{err}</div>}
        </div>

        <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:8, padding:"12px 14px", marginBottom:12 }}>
          <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:8 }}>OPCIÓN 2 — Manual</div>
          <button onClick={() => window.open(url, "_blank")}
            style={{ background:"transparent", border:"1px solid #1e3a5f", color:"#6a8aac", borderRadius:6, padding:"6px 14px", cursor:"pointer", fontFamily:"monospace", fontSize:10, marginBottom:8 }}>
            🔗 Abrir CSV en nueva pestaña → Ctrl+A → Ctrl+C
          </button>
          <textarea ref={textareaRef}
            style={{ ...S.inp, minHeight:80, resize:"vertical", fontSize:11 }}
            placeholder="Ctrl+V aquí..."
            value={csv} onChange={e => { setCsv(e.target.value); setErr(""); }} />
        </div>

        <div style={{ display:"flex", gap:10 }}>
          <button onClick={() => { if (!csv.trim()) { setErr("Pega el CSV primero"); return; } onImport(csv); }}
            style={{ background:"linear-gradient(135deg,#006b55,#004d3d)", border:"1px solid #00d4aa", color:"#00d4aa", borderRadius:6, padding:"8px 20px", cursor:"pointer", fontFamily:"monospace", fontSize:12, fontWeight:"bold" }}>
            ✓ Importar manual
          </button>
          <button onClick={onClose} style={{ background:"transparent", border:"1px solid #1e3a5f", color:"#4a90d9", borderRadius:6, padding:"8px 18px", cursor:"pointer", fontFamily:"monospace", fontSize:12 }}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

// ─── ALTROUTE ──────────────────────────────────────────────────────────────────
function AltRouteModule({ onRutasLoaded }) {
  const [rutas,  setRutas]      = useState([]);
  const [aprs,   setAprs]       = useState([]);
  const [loading, setLoading]   = useState(true);
  const [lastUpdate, setLastUpdate] = useState(null);
  const [importMode, setImportMode] = useState(null);
  const [fOrigen,  setFOrigen]  = useState("");
  const [fPSalida, setFPSalida] = useState("");
  const [fAlterno, setFAlterno] = useState("");
  const [wx, setWx] = useState({});
  const [wxLoading, setWxLoading] = useState(false);

  async function loadData() {
    setLoading(true);
    // Try auto-load from sheet first
    try {
      const [rutasCSV, aprsCSV] = await Promise.all([
        fetchSheet("rutas"),
        fetchSheet("aproximaciones"),
      ]);
      if (rutasCSV && !rutasCSV.includes("<!DOCTYPE")) {
        const pr = parseRutas(rutasCSV);
        if (pr.length) { setRutas(pr); await storageSet(STORAGE_RUTAS, rutasCSV); }
      }
      if (aprsCSV && !aprsCSV.includes("<!DOCTYPE")) {
        const pa = parseAprs(aprsCSV);
        if (pa.length) { setAprs(pa); await storageSet(STORAGE_APRS, aprsCSV); }
      }
      setLastUpdate(new Date().toLocaleTimeString("es-CL") + " (sheet)");
      setLoading(false);
      return;
    } catch {}
    // Fallback: localStorage
    const rutasCSV = await storageGet(STORAGE_RUTAS);
    const aprsCSV  = await storageGet(STORAGE_APRS);
    if (rutasCSV) { const pr = parseRutas(rutasCSV); setRutas(pr); if (onRutasLoaded) onRutasLoaded(pr); }
    if (aprsCSV)  setAprs(parseAprs(aprsCSV));
    if (!rutasCSV) setImportMode("rutas");
    else setLastUpdate("caché local");
    setLoading(false);
  }

  useEffect(() => { loadData(); }, []);

  async function handleImport(csv) {
    if (importMode === "rutas") {
      const parsed = parseRutas(csv);
      if (!parsed.length) return;
      await storageSet(STORAGE_RUTAS, csv);
      setRutas(parsed);
    } else {
      const parsed = parseAprs(csv);
      if (!parsed.length) return;
      await storageSet(STORAGE_APRS, csv);
      setAprs(parsed);
    }
    setLastUpdate(new Date().toLocaleTimeString("es-CL"));
    setImportMode(null);
  }

  async function clearCache() {
    await storageDel(STORAGE_RUTAS); await storageDel(STORAGE_APRS);
    setRutas([]); setAprs([]);
    loadData();
  }

  async function fetchWx(icaos) {
    if (!icaos.length) return;
    setWxLoading(true); setWx({});
    const ids = icaos.join(",");
    try {
      const [md, td] = await Promise.all([
        fetchViaAppsScript("metar", ids),
        fetchViaAppsScript("taf",   ids),
      ]);
      const combined = {};
      icaos.forEach(icao => {
        combined[icao] = { metar: md[icao]?.metar||null, taf: td[icao]?.taf||null };
      });
      setWx(combined);
    } catch(e) { console.error("fetchWx:", e.message); }
    setWxLoading(false);
  }

  const origenes = [...new Set(rutas.map(r => r.origen))].sort();
  const salidas  = [...new Set(rutas.filter(r => !fOrigen || r.origen === fOrigen).map(r => r.pistaSalida))].sort();
  const alternos = [...new Set(rutas.filter(r => (!fOrigen||r.origen===fOrigen) && (!fPSalida||r.pistaSalida===fPSalida)).map(r => r.alterno))].sort();
  const filtered = rutas.filter(r =>
    (!fOrigen  || r.origen      === fOrigen)  &&
    (!fPSalida || r.pistaSalida === fPSalida) &&
    (!fAlterno || r.alterno     === fAlterno)
  );
  const sel = { ...S.inp, cursor:"pointer" };

  return (
    <div style={{ padding:20, maxWidth:920, margin:"0 auto" }}>
      {importMode && (
        <ImportModal
          title={importMode === "rutas" ? "HOJA RUTAS" : "HOJA APROXIMACIONES"}
          url={importMode === "rutas" ? RUTAS_URL : APRS_URL}
          onImport={handleImport}
          onClose={() => setImportMode(null)}
        />
      )}

// ─── BRIEF Module ─────────────────────────────────────────────────────────────
function BriefModule() {
  const [form, setForm] = useState({ orig:"", dest:"", timeOrig:"", timeDest:"" });
  const [status, setStatus] = useState("idle");
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");

  function ff(k, v) { setForm(p => ({ ...p, [k]: v })); }

  async function runBrief() {
    if (!form.orig || !form.dest) return;
    setStatus("loading"); setData(null); setErr("");
    try {
      const icaos = form.orig + "," + form.dest;
      const [metarD, tafD, notamO, notamD] = await Promise.all([
        fetchViaAppsScript("metar", icaos),
        fetchViaAppsScript("taf",   icaos),
        fetchViaAppsScript("notam", form.orig),
        fetchViaAppsScript("notam", form.dest),
      ]);
      setData({
        orig: { icao:form.orig, time:form.timeOrig, metar:metarD[form.orig]?.metar||null, taf:tafD[form.orig]?.taf||null, notams:notamO||[] },
        dest: { icao:form.dest, time:form.timeDest, metar:metarD[form.dest]?.metar||null, taf:tafD[form.dest]?.taf||null, notams:notamD||[] },
      });
      setStatus("done");
    } catch(e) { setErr(e.message); setStatus("error"); }
  }

  const inp = { background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, color:"#e0eaf6", padding:"8px 12px", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box", width:"100%" };
  const lbl = { color:"#4a90d9", fontSize:10, fontFamily:"monospace", marginBottom:4, display:"block", letterSpacing:"0.08em" };

  return (
    <div style={{ padding:20, maxWidth:900, margin:"0 auto" }}>
      <div style={{ background:"#0d1b2a", border:"1px solid #1e3a5f", borderRadius:10, padding:20, marginBottom:16 }}>
        <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.12em", marginBottom:16 }}>▸ PARÁMETROS DE VUELO</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:12, marginBottom:16 }}>
          <div><label style={lbl}>SALIDA (ICAO)</label>
            <input style={inp} value={form.orig} maxLength={4} onChange={e => ff("orig", e.target.value.toUpperCase())} placeholder="SCEL" /></div>
          <div><label style={lbl}>HORA SALIDA (UTC)</label>
            <input style={inp} value={form.timeOrig} maxLength={4} onChange={e => ff("timeOrig", e.target.value.replace(/[^0-9]/g,""))} placeholder="1430" /></div>
          <div><label style={lbl}>LLEGADA (ICAO)</label>
            <input style={inp} value={form.dest} maxLength={4} onChange={e => ff("dest", e.target.value.toUpperCase())} placeholder="SBGR" /></div>
          <div><label style={lbl}>HORA LLEGADA (UTC)</label>
            <input style={inp} value={form.timeDest} maxLength={4} onChange={e => ff("timeDest", e.target.value.replace(/[^0-9]/g,""))} placeholder="1730" /></div>
        </div>
        <button onClick={runBrief} disabled={status==="loading" || !form.orig || !form.dest}
          style={{ background:status==="loading"?"#0d1b2a":"linear-gradient(135deg,#1a6fb5,#0d4a8a)", border:"1px solid #2a7fd4", color:"#e0eaf6", borderRadius:6, padding:"9px 24px", cursor:status==="loading"?"not-allowed":"pointer", fontFamily:"monospace", fontSize:12, fontWeight:"bold" }}>
          {status==="loading" ? "▶ Consultando..." : "▶ BRIEF"}
        </button>
        {err && <div style={{ marginTop:10, fontSize:11, color:"#e74c3c", fontFamily:"monospace" }}>✕ {err}</div>}
      </div>

      {status==="loading" && (
        <div style={{ background:"#0d1b2a", border:"1px solid #1e3a5f", borderRadius:10, padding:24 }}>
          {["METAR / TAF","NOTAMs " + form.orig,"NOTAMs " + form.dest].map((s,i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:12, padding:"8px 0", borderBottom:i<2?"1px solid #0f2030":"none" }}>
              <div style={{ width:18, height:18, borderRadius:"50%", background:"#0d4a8a", border:"1px solid #4a90d9", display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, color:"#4a90d9" }}>●</div>
              <span style={{ fontSize:12, color:"#4a90d9", fontFamily:"monospace" }}>Consultando {s}...</span>
            </div>
          ))}
        </div>
      )}

      {status==="done" && data && [data.orig, data.dest].map((ap, idx) => (
        <div key={idx} style={{ background:"#0d1b2a", border:"1px solid #1e3a5f", borderRadius:10, padding:20, marginBottom:16 }}>
          <div style={{ fontSize:11, color:"#00d4aa", fontFamily:"monospace", fontWeight:"bold", marginBottom:14, letterSpacing:"0.1em" }}>
            {ap.icao}{ap.time ? " · " + ap.time + "Z" : ""} · {idx===0 ? "SALIDA" : "LLEGADA"}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
            <div>
              <div style={{ fontSize:9, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:5 }}>METAR</div>
              {ap.metar
                ? <div style={{ fontSize:11, color:"#e0eaf6", fontFamily:"monospace", background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, padding:"8px 12px", lineHeight:1.7, wordBreak:"break-all" }}>{ap.metar}</div>
                : <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>No disponible</div>}
            </div>
            <div>
              <div style={{ fontSize:9, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:5 }}>TAF</div>
              {ap.taf
                ? <div style={{ fontSize:11, color:"#8aabcc", fontFamily:"monospace", background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, padding:"8px 12px", lineHeight:1.7, wordBreak:"break-all", whiteSpace:"pre-wrap" }}>{ap.taf}</div>
                : <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>No disponible</div>}
            </div>
          </div>
          <div>
            <div style={{ fontSize:9, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:6 }}>NOTAMs ({ap.notams.length})</div>

              ? <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>Sin NOTAMs activos</div>
              : ap.notams.map((n, i) => (
                  <div key={i} style={{ fontSize:10, color:"#8aabcc", fontFamily:"monospace", background:"#061220", border:"1px solid #1e3a5f", borderRadius:4, padding:"6px 10px", lineHeight:1.6, marginBottom:4 }}>{n}</div>
                ))
            }
          </div>
        </div>
      ))}
    </div>
  );
}


// ─── CALC Module ───────────────────────────────────────────────────────────────
function CalcVIP() {
  const [form, setForm] = useState({ alpha:"", altInicial:"", rwyElev:"", tch:"" });
  const [result, setResult] = useState(null);
  const CONST = 106;

  function ff(k, v) { setForm(p => ({ ...p, [k]: v })); setResult(null); }

  function calc() {
    const alpha      = parseFloat(form.alpha);
    const altInicial = parseFloat(form.altInicial);
    const rwyElev    = parseFloat(form.rwyElev);
    const tch        = parseFloat(form.tch);
    if ([alpha, altInicial, rwyElev, tch].some(isNaN)) return;
    const vip = (altInicial - (rwyElev + tch)) / (alpha * CONST);
    setResult(vip);
  }

  const inp = { background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, color:"#e0eaf6", padding:"8px 12px", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box", width:"100%" };
  const lbl = { color:"#4a90d9", fontSize:10, fontFamily:"monospace", marginBottom:4, display:"block", letterSpacing:"0.08em" };
  const allFilled = form.alpha && form.altInicial && form.rwyElev && form.tch;

  return (
    <div style={{ background:"#0d1b2a", border:"1px solid #1e3a5f", borderRadius:10, padding:20, marginBottom:16 }}>
      <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.12em", marginBottom:16 }}>▸ VIP — VISUAL INTERCEPT POINT</div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:12, marginBottom:16 }}>
        <div>
          <label style={lbl}>ALPHA (°) — Ángulo de aproximación</label>
          <input style={inp} type="number" step="0.1" value={form.alpha}
            onChange={e => ff("alpha", e.target.value)} placeholder="3.0" />
        </div>
        <div>
          <label style={lbl}>ALTITUD INICIAL (ft)</label>
          <input style={inp} type="number" value={form.altInicial}
            onChange={e => ff("altInicial", e.target.value)} placeholder="2000" />
        </div>
        <div>
          <label style={lbl}>RUNWAY ELEVATION (ft)</label>
          <input style={inp} type="number" value={form.rwyElev}
            onChange={e => ff("rwyElev", e.target.value)} placeholder="1555" />
        </div>
        <div>
          <label style={lbl}>TCH — Threshold Crossing Height (ft)</label>
          <input style={inp} type="number" value={form.tch}
            onChange={e => ff("tch", e.target.value)} placeholder="50" />
        </div>
      </div>

      {/* Formula display */}
      <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, padding:"10px 14px", marginBottom:14, fontFamily:"monospace", fontSize:11, color:"#6a8aac", lineHeight:1.8 }}>
        <span style={{ color:"#2a4a6b" }}>VIP = </span>
        <span style={{ color:"#e0eaf6" }}>({form.altInicial||"Alt.Inicial"} − ({form.rwyElev||"RwyElev"} + {form.tch||"TCH"}))</span>
        <span style={{ color:"#2a4a6b" }}> / </span>
        <span style={{ color:"#e0eaf6" }}>({form.alpha||"α"} × {CONST})</span>
      </div>

      <button onClick={calc} disabled={!allFilled}
        style={{ background:allFilled?"linear-gradient(135deg,#1a6fb5,#0d4a8a)":"#0d1b2a", border:"1px solid #2a7fd4", color:allFilled?"#e0eaf6":"#2a4a6b", borderRadius:6, padding:"9px 24px", cursor:allFilled?"pointer":"not-allowed", fontFamily:"monospace", fontSize:12, fontWeight:"bold", marginBottom: result !== null ? 16 : 0 }}>
        ▶ CALCULAR
      </button>

      {result !== null && (
        <div>
          {/* Dos cuadros resultado */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 }}>
            {/* VIP */}
            <div style={{ background:"#061220", border:"1px solid #00d4aa", borderRadius:8, padding:"20px 16px", textAlign:"center" }}>
              <div style={{ fontSize:9, color:"#00d4aa", letterSpacing:"0.14em", marginBottom:10, textAlign:"center" }}>VIP</div>
              <div style={{ fontSize:48, fontWeight:"bold", color:"#00d4aa", fontFamily:"monospace", lineHeight:1, textAlign:"center" }}>
                {result.toFixed(2)}
              </div>
              <div style={{ fontSize:10, color:"#00d4aa", fontFamily:"monospace", marginTop:8, opacity:0.7 }}>NM</div>
            </div>
            {/* FPA SELECTOR PULL */}
            <div style={{ background:"#061220", border:"1px solid #f5c518", borderRadius:8, padding:"20px 16px", textAlign:"center" }}>
              <div style={{ fontSize:9, color:"#f5c518", letterSpacing:"0.1em", marginBottom:10, textAlign:"center" }}>FPA SELECTOR PULL</div>
              <div style={{ fontSize:48, fontWeight:"bold", color:"#f5c518", fontFamily:"monospace", lineHeight:1, textAlign:"center" }}>
                {(result + 0.3).toFixed(2)}
              </div>
              <div style={{ fontSize:10, color:"#f5c518", fontFamily:"monospace", marginTop:8, opacity:0.7 }}>NM</div>
            </div>
          </div>
          {/* Desglose cálculo */}
          <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, padding:"10px 14px", display:"flex", gap:24, flexWrap:"wrap" }}>
            <span style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>
              RwyElev + TCH = <span style={{ color:"#e0eaf6" }}>{parseFloat(form.rwyElev) + parseFloat(form.tch)} ft</span>
            </span>
            <span style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>
              Altura efectiva = <span style={{ color:"#e0eaf6" }}>{parseFloat(form.altInicial) - (parseFloat(form.rwyElev) + parseFloat(form.tch))} ft</span>
            </span>
            <span style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>
              Divisor = <span style={{ color:"#e0eaf6" }}>{(parseFloat(form.alpha) * CONST).toFixed(1)}</span>
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

function CalcFuel() {
  const [form, setForm] = useState({ fuelActual:"", fuelFlow:"", tripFuel:"", penalty:"0" });
  const [result, setResult] = useState(null);

  function ff(k, v) { setForm(p => ({ ...p, [k]: v })); setResult(null); }

  function toHHMM(hours) {
    const h = Math.floor(hours);
    const m = Math.round((hours - h) * 60);
    return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
  }

  function calc() {
    const fuelActual = parseFloat(form.fuelActual);
    const fuelFlow   = parseFloat(form.fuelFlow);
    const penalty    = parseFloat(form.penalty) || 0;
    if (isNaN(fuelActual) || isNaN(fuelFlow) || fuelFlow <= 0) return;
    const tiempoRestante = fuelActual / fuelFlow;
    let tripConPenalty = null, fod = null;
    if (form.tripFuel !== "" && !isNaN(parseFloat(form.tripFuel))) {
      tripConPenalty = parseFloat(form.tripFuel) * (1 + penalty / 100);
      fod = fuelActual - tripConPenalty;
    }
    setResult({ tiempoRestante, tripConPenalty, fod });
  }

  const inp = { background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, color:"#e0eaf6", padding:"8px 12px", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box", width:"100%" };
  const lbl = { color:"#4a90d9", fontSize:10, fontFamily:"monospace", marginBottom:4, display:"block", letterSpacing:"0.08em" };
  const allFilled = form.fuelActual && form.fuelFlow;
  const canCalcFOD = form.tripFuel !== "" && form.tripFuel !== undefined;

  return (
    <div style={{ background:"#0d1b2a", border:"1px solid #1e3a5f", borderRadius:10, padding:20, marginBottom:16 }}>
      <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.12em", marginBottom:16 }}>▸ FUEL REMAINING</div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <div>
            <label style={lbl}>FUEL ACTUAL (kg)</label>
            <input style={inp} type="number" value={form.fuelActual}
              onChange={e => ff("fuelActual", e.target.value)} placeholder="8500" />
          </div>
          <div>
            <label style={lbl}>FUEL FLOW (kg/h)</label>
            <input style={inp} type="number" value={form.fuelFlow}
              onChange={e => ff("fuelFlow", e.target.value)} placeholder="2400" />
          </div>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <div>
            <label style={lbl}>TRIP FUEL (kg)</label>
            <input style={inp} type="number" value={form.tripFuel}
              onChange={e => ff("tripFuel", e.target.value)} placeholder="1500" />
          </div>
          <div>
            <label style={lbl}>PENALTY FACTOR</label>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <input style={{ ...inp, flex:1 }} type="number" min="0" value={form.penalty}
                onChange={e => ff("penalty", e.target.value)} placeholder="0" />
              <span style={{ color:"#4a90d9", fontFamily:"monospace", fontSize:16, fontWeight:"bold", flexShrink:0 }}>%</span>
            </div>
          </div>
        </div>
      </div>

      <button onClick={calc} disabled={!allFilled}

                      {Math.round(result.fod).toLocaleString()}

            </div>
          </div>
          {/* Desglose */}
          <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, padding:"10px 14px", display:"flex", gap:24, flexWrap:"wrap" }}>
            {result.tripConPenalty !== null && (
              <span style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>

            <span style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>

        </div>
      )}
    </div>
  );
}


// ─── LDG WIND Calculator ───────────────────────────────────────────────────────
function calcComponents(windDir, windSpd, rwyHdg) {
  if (windDir === null || windSpd === null) return null;
  const diff = ((windDir - rwyHdg + 180) % 360) - 180;
  const rad  = diff * Math.PI / 180;
  const hw   = Math.round(windSpd * Math.cos(rad));
  const xw   = Math.round(Math.abs(windSpd * Math.sin(rad)));
  const xwDir = Math.sin(rad) >= 0 ? "→" : "←";
  return { hw, xw, xwDir };
}

function oppositeRwy(rwy) {
  const match = rwy.match(/^(\d+)([LRC]?)$/);
  if (!match) return null;
  let num = parseInt(match[1]);
  const suf = match[2];
  const opp = ((num + 18 - 1) % 36) + 1;
  const oppSuf = suf === "L" ? "R" : suf === "R" ? "L" : suf;
  return String(opp).padStart(2,"0") + oppSuf;
}

function RunwayDiagram({ rwy, windDir, windSpd }) {
  const hdg     = parseInt(rwy.replace(/[LRC]/g,"")) * 10;
  const oppRwy  = oppositeRwy(rwy) || "??";
  const oppHdg  = (hdg + 180) % 360;
  const compTop = calcComponents(windDir, windSpd, hdg);
  const compBot = calcComponents(windDir, windSpd, oppHdg);

  const hwColorTop = compTop ? (compTop.hw >= 0 ? "#2ecc71" : "#e74c3c") : "#2a4a6b";
  const hwColorBot = compBot ? (compBot.hw >= 0 ? "#2ecc71" : "#e74c3c") : "#2a4a6b";

  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", minWidth:130 }}>
      {/* Top threshold info */}
      <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:"8px 8px 0 0", padding:"10px 14px", width:"100%", textAlign:"center" }}>
        <div style={{ fontSize:13, fontWeight:"bold", color:"#e0eaf6", fontFamily:"monospace", marginBottom:6 }}>{rwy}</div>
        {compTop ? (<>
          <div style={{ fontSize:12, color:hwColorTop, fontFamily:"monospace", fontWeight:"bold" }}>
            {compTop.hw >= 0 ? "↓" : "↑"} {Math.abs(compTop.hw)}kt {compTop.hw >= 0 ? "HW" : "TW"}
          </div>
          <div style={{ fontSize:11, color:"#f5c518", fontFamily:"monospace" }}>
            {compTop.xwDir} {compTop.xw}kt XW
          </div>
        </>) : (
          <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>—</div>
        )}
      </div>

      {/* Runway body */}
      <div style={{ background:"#1a1a2e", border:"1px solid #2a3a5a", borderTop:"none", borderBottom:"none", width:"100%", height:160, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:8, position:"relative" }}>
        {/* Center line dashes */}
        {Array.from({length:6}, (_,i) => (
          <div key={i} style={{ width:3, height:18, background:"#f5c518", borderRadius:2, opacity:0.6 }}/>
        ))}
      </div>

      {/* Bottom threshold info */}
      <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:"0 0 8px 8px", padding:"10px 14px", width:"100%", textAlign:"center" }}>
        {compBot ? (<>
          <div style={{ fontSize:12, color:hwColorBot, fontFamily:"monospace", fontWeight:"bold" }}>
            {compBot.hw >= 0 ? "↓" : "↑"} {Math.abs(compBot.hw)}kt {compBot.hw >= 0 ? "HW" : "TW"}
          </div>
          <div style={{ fontSize:11, color:"#f5c518", fontFamily:"monospace" }}>
            {compBot.xwDir} {compBot.xw}kt XW
          </div>
        </>) : (
          <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>—</div>
        )}
        <div style={{ fontSize:13, fontWeight:"bold", color:"#e0eaf6", fontFamily:"monospace", marginTop:6 }}>{oppRwy}</div>
      </div>
    </div>
  );
}

function CalcLdgWind({ rutas }) {
  // Deduce airports and runways from rutas
  const airportRunways = {};
  rutas.forEach(r => {
    if (!r.origen) return;
    if (!airportRunways[r.origen]) airportRunways[r.origen] = new Set();
    if (r.pistaSalida) airportRunways[r.origen].add(r.pistaSalida);
  });
  const airports = Object.keys(airportRunways).sort();

  const [selectedApt, setSelectedApt] = useState("");
  const [windMode, setWindMode]       = useState("metar"); // "metar" | "manual"
  const [windDir, setWindDir]         = useState("");
  const [windSpd, setWindSpd]         = useState("");
  const [metarRaw, setMetarRaw]       = useState("");
  const [loading, setLoading]         = useState(false);
  const [err, setErr]                 = useState("");

  const runways = selectedApt ? [...airportRunways[selectedApt]] : [];
  const [extraRwys, setExtraRwys] = useState([]);
  const [manualRwy, setManualRwy] = useState("");
  const allRunways = [...new Set([...runways, ...extraRwys])];

  function addManualRwy() {
    const rwy = manualRwy.trim().toUpperCase();
    if (!rwy) return;
    if (!allRunways.includes(rwy)) setExtraRwys(prev => [...prev, rwy]);
    setManualRwy("");
  }

  // Parse wind from METAR
  const parsedDir = windMode === "metar" && metarRaw
    ? (() => { const m = metarRaw.match(/(\d{3}|VRB)(\d{2,3})KT/); return m && m[1] !== "VRB" ? parseInt(m[1]) : null; })()
    : windDir !== "" ? parseInt(windDir) : null;

  const parsedSpd = windMode === "metar" && metarRaw
    ? (() => { const m = metarRaw.match(/(?:\d{3}|VRB)(\d{2,3})KT/); return m ? parseInt(m[1]) : null; })()
    : windSpd !== "" ? parseInt(windSpd) : null;

  const isVRB = windMode === "metar" && metarRaw && /VRB/.test(metarRaw);

  async function fetchMetar() {
    if (!selectedApt) return;
    setLoading(true); setErr(""); setMetarRaw("");
    try {
      const data = await fetchViaAppsScript("metar", selectedApt);
      const metar = data[selectedApt]?.metar || null;
      if (!metar) throw new Error("Sin METAR disponible para " + selectedApt);
      setMetarRaw(metar);
    } catch(e) { setErr(e.message); }
    setLoading(false);
  }

  const inp = { background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, color:"#e0eaf6", padding:"8px 12px", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box" };
  const lbl = { color:"#4a90d9", fontSize:10, fontFamily:"monospace", marginBottom:4, display:"block", letterSpacing:"0.08em" };

  return (
    <div style={{ background:"#0d1b2a", border:"1px solid #1e3a5f", borderRadius:10, padding:20, marginBottom:16 }}>
      <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.12em", marginBottom:16 }}>▸ LDG WIND — COMPONENTES POR PISTA</div>

      {/* Airport selector */}
      <div style={{ marginBottom:16 }}>
        <label style={lbl}>AEROPUERTO</label>
        <select style={{ ...inp, width:"100%", cursor:"pointer" }}
          value={selectedApt} onChange={e => { setSelectedApt(e.target.value); setMetarRaw(""); setErr(""); }}>
          <option value="">— Seleccionar —</option>
          {airports.map(a => <option key={a}>{a}</option>)}
        </select>
      </div>

      {selectedApt && (<>
        {/* Wind source toggle */}
        <div style={{ display:"flex", gap:8, marginBottom:16 }}>
          <button onClick={() => { setWindMode("metar"); fetchMetar(); }}
            style={{ background:windMode==="metar"?"linear-gradient(135deg,#1a6fb5,#0d4a8a)":"transparent", border:"1px solid #2a7fd4", color:"#e0eaf6", borderRadius:6, padding:"7px 16px", cursor:"pointer", fontFamily:"monospace", fontSize:11, fontWeight:"bold" }}>
            ⚡ {loading ? "Cargando..." : "Usar METAR"}
          </button>
          <button onClick={() => setWindMode("manual")}
            style={{ background:windMode==="manual"?"#1a2d42":"transparent", border:"1px solid #1e3a5f", color:"#4a90d9", borderRadius:6, padding:"7px 16px", cursor:"pointer", fontFamily:"monospace", fontSize:11 }}>
            ✏️ Manual
          </button>
        </div>

        {/* METAR display */}
        {windMode === "metar" && metarRaw && (
          <div style={{ background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, padding:"8px 12px", marginBottom:16, fontSize:11, color:"#8aabcc", fontFamily:"monospace", lineHeight:1.6 }}>
            {metarRaw}
          </div>
        )}
        {windMode === "metar" && isVRB && (
          <div style={{ fontSize:11, color:"#f5c518", fontFamily:"monospace", marginBottom:12 }}>⚠ Viento variable (VRB) — sin componentes calculables</div>
        )}
        {err && <div style={{ fontSize:11, color:"#e74c3c", fontFamily:"monospace", marginBottom:12 }}>✕ {err}</div>}

        {/* Manual wind input */}
        {windMode === "manual" && (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
            <div>
              <label style={lbl}>DIRECCIÓN (°)</label>
              <input style={{ ...inp, width:"100%" }} type="number" min="0" max="360"
                value={windDir} onChange={e => setWindDir(e.target.value)} placeholder="270" />
            </div>
            <div>
              <label style={lbl}>VELOCIDAD (kt)</label>
              <input style={{ ...inp, width:"100%" }} type="number" min="0"
                value={windSpd} onChange={e => setWindSpd(e.target.value)} placeholder="15" />
            </div>
          </div>
        )}

        {/* Wind summary */}
        {parsedDir !== null && parsedSpd !== null && (
          <div style={{ fontSize:11, color:"#6a8aac", fontFamily:"monospace", marginBottom:16 }}>
            Viento: <span style={{ color:"#e0eaf6" }}>{String(parsedDir).padStart(3,"0")}° / {parsedSpd}kt</span>
          </div>
        )}

        {/* Runway diagrams */}
        {/* Manual runway input */}
        <div style={{ marginBottom:16 }}>
          <label style={lbl}>PISTAS ADICIONALES (opcional)</label>
          <div style={{ display:"flex", gap:8 }}>
            <input style={{ ...inp, flex:1 }} value={manualRwy}
              onChange={e => setManualRwy(e.target.value.toUpperCase())}
              onKeyDown={e => { if (e.key==="Enter") addManualRwy(); }}
              placeholder="ej: 17R" maxLength={4} />
            <button onClick={addManualRwy}
              style={{ background:"transparent", border:"1px solid #4a90d9", color:"#4a90d9", borderRadius:6, padding:"8px 14px", cursor:"pointer", fontFamily:"monospace", fontSize:11 }}>
              + Agregar
            </button>
          </div>
          {extraRwys.length > 0 && (
            <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap" }}>
              {extraRwys.map(r => (
                <span key={r} style={{ background:"#1a2d42", border:"1px solid #2a7fd4", borderRadius:4, padding:"2px 8px", fontSize:11, color:"#4a90d9", fontFamily:"monospace", display:"flex", alignItems:"center", gap:6 }}>
                  {r}
                  <span onClick={() => setExtraRwys(prev => prev.filter(x => x !== r))}
                    style={{ cursor:"pointer", color:"#4a3030", fontSize:10 }}>✕</span>
                </span>
              ))}
            </div>
          )}
        </div>

        {allRunways.length > 0 && (
          <div style={{ display:"flex", gap:16, flexWrap:"wrap", justifyContent:"center" }}>
            {allRunways.map(rwy => (
              <RunwayDiagram key={rwy} rwy={rwy}
                windDir={parsedDir} windSpd={parsedSpd} />
            ))}
          </div>
        )}
      </>)}
    </div>
  );
}

// ─── Haversine distance ────────────────────────────────────────────────────────
function haversineNm(lat1, lon1, lat2, lon2) {
  const R = 3440.065; // NM
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ─── MedAlt Module ────────────────────────────────────────────────────────────
function MedAltModule() {
  const mapRef      = useRef(null);
  const leafletMap  = useRef(null);
  const markersRef  = useRef({});
  const posMarker   = useRef(null);

  const [userPos,   setUserPos]   = useState(null);
  const [gpsErr,    setGpsErr]    = useState("");
  const [gpsLoad,   setGpsLoad]   = useState(false);
  const [speed,     setSpeed]     = useState("");  // kt
  const [selected,  setSelected]  = useState(null);

  // Init map once
  useEffect(() => {
    if (leafletMap.current) return;
    const map = L.map(mapRef.current, {
      center: [-15, -55],
      zoom: 4,
      zoomControl: true,
    });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
      maxZoom: 14,
    }).addTo(map);
    leafletMap.current = map;

    // Add airport markers
    Object.entries(MEDALT_AIRPORTS).forEach(([icao, apt]) => {
      const aptIcon = L.divIcon({
        className: "",
        html: `<div style="display:flex;flex-direction:column;align-items:center;">
          <div style="background:rgba(6,18,32,0.85);border:1px solid #4a90d9;border-radius:4px;padding:2px 6px;font-family:monospace;font-size:12px;font-weight:bold;color:#e0eaf6;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.8);">${icao}</div>
          <div style="width:2px;height:5px;background:#4a90d9;"></div>
          <div style="width:8px;height:8px;background:#e74c3c;border:2px solid #ff8888;border-radius:50%;box-shadow:0 0 6px rgba(231,76,60,0.8);"></div>
        </div>`,
        iconSize: [52, 32],
        iconAnchor: [26, 32],
      });
      const marker = L.marker([apt.lat, apt.lon], { icon: aptIcon })
        .addTo(map)
        .on("click", () => {});
      marker._icao = icao;
      markersRef.current[icao] = marker;
    });

    // Click handler via map event
    map.on("click", () => setSelected(null));

    return () => { map.remove(); leafletMap.current = null; };
  }, []);

  // Update markers on click to set selected
  useEffect(() => {
    Object.entries(markersRef.current).forEach(([icao, marker]) => {
      marker.off("click");
      marker.on("click", (e) => {
        L.DomEvent.stopPropagation(e);
        setSelected(icao);
      });
    });
  }, []);

  // Update position marker
  useEffect(() => {
    if (!leafletMap.current) return;
    if (posMarker.current) { posMarker.current.remove(); posMarker.current = null; }
    if (!userPos) return;

    const posIcon = L.divIcon({
      className: "",
      html: `<div style="position:relative;width:20px;height:20px;">
        <div style="position:absolute;inset:0;border-radius:50%;background:rgba(74,144,217,0.2);border:2px solid #4a90d9;animation:pulse 2s infinite;"></div>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:#4a90d9;border-radius:50%;border:2px solid #fff;"></div>
        <span style="position:absolute;left:22px;top:-3px;font-size:10px;color:#4a90d9;font-family:monospace;white-space:nowrap;font-weight:bold;">TU POSICIÓN</span>
      </div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10],
    });
    posMarker.current = L.marker([userPos.lat, userPos.lon], { icon: posIcon, zIndexOffset: 1000 }).addTo(leafletMap.current);
  }, [userPos]);

  // Draw line to selected airport
  useEffect(() => {
    if (!leafletMap.current) return;
    // Remove existing lines
    leafletMap.current.eachLayer(layer => {
      if (layer instanceof L.Polyline && !(layer instanceof L.Polygon)) {
        layer.remove();
      }
    });
    if (!userPos || !selected || !MEDALT_AIRPORTS[selected]) return;
    const apt = MEDALT_AIRPORTS[selected];
    L.polyline([[userPos.lat, userPos.lon], [apt.lat, apt.lon]], {
      color: "#f5c518", weight: 1.5, dashArray: "6,6", opacity: 0.7,
    }).addTo(leafletMap.current);
  }, [userPos, selected]);

  function getGPS() {
    setGpsLoad(true); setGpsErr("");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude: lat, longitude: lon } = pos.coords;
        setUserPos({ lat, lon });
        setGpsLoad(false);
        if (leafletMap.current) leafletMap.current.setView([lat, lon], 5);
      },
      (err) => { setGpsErr("GPS no disponible: " + err.message); setGpsLoad(false); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  const selectedApt = selected ? MEDALT_AIRPORTS[selected] : null;
  const distNm = (userPos && selectedApt)
    ? haversineNm(userPos.lat, userPos.lon, selectedApt.lat, selectedApt.lon)
    : null;
  const speedKt = parseFloat(speed);
  const timeMin = (distNm && speedKt > 0) ? (distNm / speedKt) * 60 : null;

  const inp = { background:"#061220", border:"1px solid #1e3a5f", borderRadius:6, color:"#e0eaf6", padding:"8px 12px", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box" };
  const lbl = { color:"#4a90d9", fontSize:10, fontFamily:"monospace", marginBottom:4, display:"block", letterSpacing:"0.08em" };

  return (
    <div style={{ padding:20, maxWidth:900, margin:"0 auto" }}>
      <style>{`
        @keyframes pulse {
          0%   { transform: scale(1); opacity: 1; }
          50%  { transform: scale(1.8); opacity: 0.3; }
          100% { transform: scale(1); opacity: 1; }
        }
      `}</style>

      {/* Controls bar */}
      <div style={{ background:"#0d1b2a", border:"1px solid #1e3a5f", borderRadius:10, padding:16, marginBottom:12, display:"flex", flexWrap:"wrap", gap:12, alignItems:"flex-end" }}>
        {/* GPS button */}
        <div>
          <label style={lbl}>POSICIÓN ACTUAL</label>
          <button onClick={getGPS} disabled={gpsLoad}
            style={{ background: userPos ? "linear-gradient(135deg,#0d4a8a,#082d57)" : "linear-gradient(135deg,#1a6fb5,#0d4a8a)", border:"1px solid #2a7fd4", color:"#e0eaf6", borderRadius:6, padding:"8px 18px", cursor:gpsLoad?"not-allowed":"pointer", fontFamily:"monospace", fontSize:11, fontWeight:"bold" }}>
            {gpsLoad ? "⏳ Obteniendo GPS..." : userPos ? "✓ GPS Activo — Actualizar" : "⊕ Obtener GPS"}
          </button>
          {gpsErr && <div style={{ fontSize:10, color:"#e74c3c", marginTop:4, fontFamily:"monospace" }}>{gpsErr}</div>}
          {userPos && <div style={{ fontSize:10, color:"#00d4aa", marginTop:4, fontFamily:"monospace" }}>
            {userPos.lat.toFixed(4)}° / {userPos.lon.toFixed(4)}°
          </div>}
        </div>

        {/* Speed input */}
        <div style={{ minWidth:140 }}>
          <label style={lbl}>VELOCIDAD (kt)</label>
          <input style={{ ...inp, width:140 }} type="number" value={speed} min="0" max="999"
            onChange={e => setSpeed(e.target.value)} placeholder="450" />
        </div>

        {/* Legend */}
        <div style={{ marginLeft:"auto", display:"flex", gap:16, alignItems:"center" }}>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:10, height:10, background:"#e74c3c", borderRadius:"50%", border:"2px solid #ff8888" }}/>
            <span style={{ fontSize:10, color:"#6a8aac", fontFamily:"monospace" }}>ALTERNO MED</span>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:10, height:10, background:"#4a90d9", borderRadius:"50%", border:"2px solid #fff" }}/>
            <span style={{ fontSize:10, color:"#6a8aac", fontFamily:"monospace" }}>TU POSICIÓN</span>
          </div>
        </div>
      </div>

      {/* Info panel — selected airport */}
      {selected && selectedApt && (
        <div style={{ background:"#0d1b2a", border:"1px solid #4a90d9", borderRadius:10, padding:14, marginBottom:12, display:"flex", flexWrap:"wrap", gap:20, alignItems:"center" }}>
          <div>
            <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.1em", marginBottom:2 }}>ALTERNO SELECCIONADO</div>
            <div style={{ fontSize:18, fontWeight:"bold", color:"#e0eaf6", fontFamily:"monospace" }}>{selected}</div>
            <div style={{ fontSize:11, color:"#6a8aac", fontFamily:"monospace" }}>{selectedApt.name}</div>
          </div>
          {distNm !== null && (
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:2 }}>DISTANCIA</div>
              <div style={{ fontSize:22, fontWeight:"bold", color:"#00d4aa", fontFamily:"monospace" }}>{distNm.toFixed(0)} <span style={{ fontSize:12 }}>NM</span></div>
            </div>
          )}
          {timeMin !== null && (
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:10, color:"#4a90d9", letterSpacing:"0.08em", marginBottom:2 }}>TIEMPO EST.</div>
              <div style={{ fontSize:22, fontWeight:"bold", color:"#f5c518", fontFamily:"monospace" }}>
                {Math.floor(timeMin)}<span style={{ fontSize:12 }}>h</span>{String(Math.round(timeMin % 60)).padStart(2,"0")}<span style={{ fontSize:12 }}>m</span>
              </div>
            </div>
          )}
          {distNm !== null && !speedKt && (
            <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>↑ Ingresa velocidad para tiempo estimado</div>
          )}
          {!userPos && (
            <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace" }}>↑ Activa GPS para ver distancia</div>
          )}
          <button onClick={() => setSelected(null)} style={{ marginLeft:"auto", background:"transparent", border:"none", color:"#2a4a6b", cursor:"pointer", fontSize:16, padding:"4px 8px" }}>✕</button>
        </div>
      )}

      {/* Map */}
      <div ref={mapRef} className="medalt-map" />

      <div style={{ fontSize:10, color:"#2a4a6b", fontFamily:"monospace", marginTop:8, textAlign:"center" }}>
        Toca un aeropuerto en el mapa para ver distancia y tiempo estimado
      </div>
    </div>
  );
}

// ─── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("altroute");
  const [sharedRutas, setSharedRutas] = useState([]);
  return (
    <div style={{ background:"#061220", minHeight:"100vh", fontFamily:"monospace", color:"#e0eaf6" }}>
      <div style={{ background:"linear-gradient(180deg,#0d1b2a,#061220)", borderBottom:"1px solid #1e3a5f", padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <span style={{ fontSize:20, color:"#e0eaf6" }}>✈</span>
          <div style={{ width:1, height:32, background:"#4a90d9", opacity:0.6 }} />
          <div>
            <div style={{ fontSize:14, fontWeight:"bold", color:"#e0eaf6", letterSpacing:"0.14em", fontFamily:"monospace" }}>PILOT OPS SUITE</div>
            <div style={{ display:"flex", alignItems:"baseline", gap:4, marginTop:2 }}>
              <span style={{ fontSize:8, color:"#2a4a6b", fontFamily:"monospace" }}>by</span>
              <span style={{ fontSize:10, fontFamily:"monospace", fontWeight:"bold", letterSpacing:"0.12em" }}>
                <span style={{ color:"#e0eaf6" }}>GAS</span><span style={{ color:"#4a90d9" }}>P</span>
              </span>
            </div>
          </div>
        </div>
        <nav style={{ display:"flex", gap:6 }}>
          {[{id:"altroute",label:"ALTROUTE"},{id:"brief",label:"BRIEF"},{id:"calc",label:"CALC"},{id:"medalt",label:"MEDALT"}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{ background:tab===t.id?"#1a2d42":"transparent", border:"1px solid "+(tab===t.id?"#4a90d9":"#1e3a5f"), color:tab===t.id?"#e0eaf6":"#4a90d9", borderRadius:6, padding:"6px 16px", cursor:"pointer", fontFamily:"monospace", fontSize:10, fontWeight:"bold", letterSpacing:"0.1em" }}>{t.label}</button>
          ))}
        </nav>
      </div>
      {tab==="altroute" && <AltRouteModule onRutasLoaded={setSharedRutas} />}
      {tab==="brief"    && <BriefModule />}
      {tab==="calc"     && <CalcModule rutas={sharedRutas} />}
      {tab==="medalt"   && <MedAltModule />}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
